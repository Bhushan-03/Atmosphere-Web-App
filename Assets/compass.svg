<svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">

  <!-- Compass outer ring -->
  <circle
    cx="180"
    cy="180"
    r="145"
    fill="white"
    stroke="#e8edf4"
    stroke-width="10"
  />

  <!-- Tick marks -->
  <g
    stroke="#dfe5ed"
    stroke-width="4"
    stroke-linecap="round"
  >
    <line x1="180" y1="60" x2="180" y2="72"/>
    <line x1="265" y1="95" x2="257" y2="103"/>
    <line x1="300" y1="180" x2="288" y2="180"/>
    <line x1="265" y1="265" x2="257" y2="257"/>
    <line x1="180" y1="300" x2="180" y2="288"/>
    <line x1="95" y1="265" x2="103" y2="257"/>
    <line x1="60" y1="180" x2="72" y2="180"/>
    <line x1="95" y1="95" x2="103" y2="103"/>
  </g>

  <!-- Cardinal directions -->
  <g
    fill="#173b68"
    font-family="Arial, sans-serif"
    font-size="20"
    font-weight="bold"
    text-anchor="middle"
  >
    <text x="180" y="45">N</text>
    <text x="315" y="187">E</text>
    <text x="180" y="323">S</text>
    <text x="45" y="187">W</text>
  </g>

  <!-- New blue arrow -->
  <g transform="translate(153.5 153.5) scale(1.5) rotate(-135 17 17)">
    <polygon
      fill="#0057B8"
      points="13.76,12.518 36.663,39.421 39.491,36.593 16.126,13.397 14.6,12"
    />
    <polygon
      fill="#0057B8"
      points="35,37 36,46 53,52 46,36 37,35"
    />
  </g>

  <!-- Center -->
  <circle
    cx="180"
    cy="180"
    r="14"
    fill="#eef2f7"
    stroke="#e1e6ed"
    stroke-width="2"
  />

  <circle
    cx="180"
    cy="180"
    r="5"
    fill="#f8fafc"
  />

</svg>
