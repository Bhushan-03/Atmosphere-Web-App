<svg width="120" height="120" viewBox="0 0 120 120"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="104" height="104"
        rx="25" fill="#fff7ed"/>

  <!-- Sun -->
  <g filter="url(#glow)">
    <circle cx="53" cy="57" r="23" fill="url(#heat)">
      <animate
        attributeName="r"
        values="23;25;23"
        dur="1.4s"
        repeatCount="indefinite"/>
    </circle>

    <!-- Sun rays -->
    <g stroke="#f97316"
       stroke-width="5"
       stroke-linecap="round">

      <line x1="53" y1="22" x2="53" y2="14"/>
      <line x1="53" y1="92" x2="53" y2="100"/>
      <line x1="18" y1="57" x2="10" y2="57"/>
      <line x1="88" y1="57" x2="96" y2="57"/>

      <line x1="29" y1="33" x2="23" y2="27"/>
      <line x1="77" y1="81" x2="83" y2="87"/>
      <line x1="77" y1="33" x2="83" y2="27"/>
      <line x1="29" y1="81" x2="23" y2="87"/>

      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 53 57;360 53 57"
        dur="8s"
        repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Heat waves -->
  <g fill="none"
     stroke="#ef4444"
     stroke-width="4"
     stroke-linecap="round">

    <path d="M27 82 C20 76 34 70 27 64">
      <animate
        attributeName="d"
        values="
        M27 82 C20 76 34 70 27 64;
        M27 82 C34 76 20 70 27 64;
        M27 82 C20 76 34 70 27 64"
        dur="1s"
        repeatCount="indefinite"/>
    </path>

    <path d="M40 91 C33 84 47 78 40 71">
      <animate
        attributeName="d"
        values="
        M40 91 C33 84 47 78 40 71;
        M40 91 C47 84 33 78 40 71;
        M40 91 C33 84 47 78 40 71"
        dur="1.1s"
        repeatCount="indefinite"/>
    </path>

    <path d="M55 91 C48 84 62 78 55 71">
      <animate
        attributeName="d"
        values="
        M55 91 C48 84 62 78 55 71;
        M55 91 C62 84 48 78 55 71;
        M55 91 C48 84 62 78 55 71"
        dur="0.9s"
        repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Alert badge -->
  <g>
    <circle cx="88" cy="82" r="18"
            fill="#dc2626"
            stroke="#fff"
            stroke-width="3">

      <animate
        attributeName="r"
        values="18;20;18"
        dur="1s"
        repeatCount="indefinite"/>
    </circle>

    <line x1="88" y1="72"
          x2="88" y2="84"
          stroke="white"
          stroke-width="4"
          stroke-linecap="round"/>

    <circle cx="88" cy="90" r="2.5"
            fill="white"/>
  </g>

</svg>