<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#f5f6fa"/>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#c9d3e6" stroke-width="14"/>

  <!-- Tick marks (NE, SE, SW, NW) -->
  <!-- NE -->
<line x1="313" y1="87" x2="300" y2="100"
  stroke="#8a97b3" stroke-width="3" stroke-linecap="round"/>
    <!-- SE -->
  <line x1="313" y1="313" x2="324" y2="324"
    stroke="#8a97b3" stroke-width="3" stroke-linecap="round"/>

  <!-- SW -->
  <line x1="87" y1="313" x2="76" y2="324"
    stroke="#8a97b3" stroke-width="3" stroke-linecap="round"/>

  <!-- NW -->
  <line x1="87" y1="87" x2="76" y2="76"
    stroke="#8a97b3" stroke-width="3" stroke-linecap="round"/>


  <!-- Tick marks (E and W) -->
  <line x1="322" y1="200" x2="335" y2="200"
    stroke="#8a97b3" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="200" x2="65" y2="200"
    stroke="#8a97b3" stroke-width="3" stroke-linecap="round"/>

  <!-- Tick marks (N and S) -->
  <line x1="200" y1="65" x2="200" y2="80"
    stroke="#8a97b3" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="320" x2="200" y2="335"
    stroke="#8a97b3" stroke-width="3" stroke-linecap="round"/>

  <!-- Cardinal labels -->
  <text x="200" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#3a4a66">N</text>
  <text x="200" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#3a4a66">S</text>
  <text x="45" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#3a4a66">W</text>
  <text x="355" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#3a4a66">E</text>

  <!-- Faint background needle (vertical, behind arrow) -->
  <polygon points="200,130 208,200 200,205 192,200" fill="#c9d3e6"/>
  <polygon points="200,270 208,200 200,195 192,200" fill="#c9d3e6"/>

  <!-- Blue arrow pointing North -->
  <g id="direction-arrow" transform="rotate(45 200 200)">
  <line x1="200" y1="200" x2="200" y2="110" stroke="#1a4fd6" stroke-width="7" stroke-linecap="round"/>
  <polygon points="200,90 185,120 215,120" fill="#1a4fd6"/>
  </g>

  <!-- Center hub -->
  <circle cx="200" cy="200" r="5" fill="#1a4fd6"/>
</svg>
